name: agent

# ARMv7 Linux `d200-color-agent`. Not in git (it is a device binary). Built here so a host
# without a cross compiler can still install one: the failure from `ghostdeck build` names
# https://github.com/laerad777/ghostdeck/releases/latest/download/d200-color-agent
# as the file to put in `~/.ghostdeck/bin`.
#
# Tags `v*` attach that file to the GitHub release. A tag push always builds -- path filters
# on tags would skip the one job that exists to mint the download URL. `workflow_dispatch` and
# path-filtered PRs only upload an Actions artifact; they must not mint a release.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "device/**"
      - ".github/workflows/agent.yml"

permissions:
  contents: read

jobs:
  armv7:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cross compiler
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf cmake make

      - name: Static ARM libturbojpeg
        run: |
          set -euo pipefail
          # Built from source so the tj3* API and the ELF ABI are the ones the agent links,
          # not whatever Ubuntu's armhf package happens to be. Homebrew jpeg-turbo is Mach-O
          # and the recipe already refuses it; this is the Linux counterpart that must pass
          # `--check-abi`.
          curl -fsSL --retry 3 -o libjpeg-turbo-3.0.3.tar.gz \
            https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/3.0.3/libjpeg-turbo-3.0.3.tar.gz
          echo "343e789069fc7afbcdfe44dbba7dbbf45afa98a15150e079a38e60e44578865d  libjpeg-turbo-3.0.3.tar.gz" | sha256sum --check --strict
          tar xzf libjpeg-turbo-3.0.3.tar.gz
          cmake -S libjpeg-turbo-3.0.3 -B tj-build \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=arm \
            -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc \
            -DCMAKE_INSTALL_PREFIX="$PWD/tj-sysroot" \
            -DENABLE_SHARED=OFF \
            -DENABLE_STATIC=ON \
            -DWITH_TURBOJPEG=ON \
            -DWITH_SIMD=OFF
          cmake --build tj-build -j"$(nproc)"
          cmake --install tj-build

      - name: Build d200-color-agent
        env:
          CC: arm-linux-gnueabihf-gcc
        run: |
          set -euo pipefail
          libdir=
          for candidate in "$PWD/tj-sysroot/lib" "$PWD/tj-sysroot/lib64"; do
            if [ -f "$candidate/libturbojpeg.a" ]; then
              libdir=$candidate
              break
            fi
          done
          [ -n "$libdir" ] || { echo "libturbojpeg.a missing under tj-sysroot"; find tj-sysroot -type f | head; exit 1; }
          mkdir -p dist
          TURBOJPEG_LIB=$libdir TURBOJPEG_INC="$PWD/tj-sysroot/include" \
            device/build-color-agent.sh "$PWD/dist/d200-color-agent"
          device/build-color-agent.sh --check-abi "$PWD/dist/d200-color-agent"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: d200-color-agent
          path: dist/d200-color-agent
          if-no-files-found: error
          retention-days: 14

  # Only a tag-triggered publisher receives a write token; PR/manual builds are read-only.
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: armv7
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download the verified build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: d200-color-agent
          path: dist
      - name: Attach to the GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/d200-color-agent
          fail_on_unmatched_files: true
