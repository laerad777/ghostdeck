name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Cover every advertised Python version without multiplying expensive macOS jobs.
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: ARM archive guard test prerequisites
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf
          # Tests and the default recipe use the Homebrew triplet. Ubuntu's GNU
          # hard-float toolchain has the same target under a different executable name.
          mkdir -p "$RUNNER_TEMP/arm-tools"
          for tool in gcc ar; do
            ln -s "$(command -v arm-linux-gnueabihf-$tool)" "$RUNNER_TEMP/arm-tools/armv7-linux-gnueabihf-$tool"
          done
          echo "$RUNNER_TEMP/arm-tools" >> "$GITHUB_PATH"
      - name: Device-free suite
        env:
          GHOSTDECK_HW_TEST: ""
        run: |
          set -euo pipefail
          python -m pip install pytest
          PYTHONPATH=src python -m pytest tests/ -q -ra --tb=short --durations=15 \
            --junitxml=test-results/pytest.xml
      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-${{ matrix.os }}-py${{ matrix.python-version }}-${{ github.run_attempt }}
          path: test-results/pytest.xml
          if-no-files-found: warn
          retention-days: 14

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Every commit needs a valid Signed-off-by trailer
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        # Inline deliberately: do not execute a checker from the PR's checkout.
        # tests/test_ci_workflows.py keeps this identical to the tested local tool.
        run: |
          python3 -I - "$BASE" "$HEAD" <<'PY'
          #!/usr/bin/env python3
          """Check real DCO trailers on every non-merge commit in a PR's base..head range."""
          from __future__ import annotations

          import re
          import subprocess
          import sys


          SIGNOFF = re.compile(r"Signed-off-by:\s+[^<>\s][^<>]*\s+<[^<>\s@]+@[^<>\s@]+>", re.IGNORECASE)


          def git(*args: str, input: str | None = None) -> str:
              return subprocess.run(
                  ["git", *args], input=input, text=True, capture_output=True, check=True
              ).stdout


          def check(base: str, head: str) -> int:
              # Resolve first so invalid/missing refs or option-like input cannot become an
              # empty successful check. Never hide rev-list's exit status in process substitution.
              base_sha = git("rev-parse", "--verify", "--end-of-options", f"{base}^{{commit}}").strip()
              head_sha = git("rev-parse", "--verify", "--end-of-options", f"{head}^{{commit}}").strip()
              commits = git("rev-list", "--no-merges", f"{base_sha}..{head_sha}").splitlines()
              missing = []
              for sha in commits:
                  message = git("log", "-1", "--format=%B", sha)
                  # Git parses the final trailer block, ignoring lookalikes in the subject/body.
                  trailers = git("interpret-trailers", "--parse", input=message)
                  if not any(SIGNOFF.fullmatch(line) for line in trailers.splitlines()):
                      missing.append(sha)
                      print(f"missing valid Signed-off-by trailer: {sha}", file=sys.stderr)
              if missing:
                  return 1
              print(f"DCO: checked {len(commits)} non-merge commit(s)")
              return 0


          def main(argv: list[str] | None = None) -> int:
              args = sys.argv[1:] if argv is None else argv
              if len(args) != 2:
                  print("usage: check_dco.py BASE HEAD", file=sys.stderr)
                  return 2
              try:
                  return check(*args)
              except (OSError, subprocess.CalledProcessError) as exc:
                  print(f"DCO: cannot verify commit range: {exc}", file=sys.stderr)
                  if isinstance(exc, subprocess.CalledProcessError) and exc.stderr:
                      print(exc.stderr.strip(), file=sys.stderr)
                  return 2


          if __name__ == "__main__":
              raise SystemExit(main())
          PY
