[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostdeck"
version = "0.1.0"
description = "Play JPEG video on a Ulanzi D200-class deck from macOS."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ghostdeck contributors" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
ghostdeck = "ghostdeck.cli:main"

# Optional runtime backends. Neither is a required dependency: without them the
# host cannot talk to a deck, so `ghostdeck detect`/`play` report the missing
# package instead of blaming the hardware. Both are imported by
# src/ghostdeck/usb.py (`hidapi` for HID enumeration and the 0x00ff ADB switch,
# `pyusb` for descriptor serial fallback) and required together for playback.
[project.optional-dependencies]
hid = ["hidapi"]
usb = ["pyusb"]
device = ["hidapi", "pyusb"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
